<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Automação Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border">
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <h2 class="fw-bold mb-1">Acesso ao Sistema</h2>
                            <p class="text-body-secondary mb-0">Informe suas credenciais para continuar</p>
                        </div>

                        <form id="form_login">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
                            </div>

                            <button type="submit" id="btn_login" class="btn btn-primary w-100 py-2">
                                Entrar
                            </button>
                        </form>

                        <div id="resposta" class="mt-3"></div>

                        <div class="mt-4 border-top pt-3 text-center">
                            <p class="text-body-secondary mb-1">Não tem uma conta?</p>
                            <a href="#" id="link_cad_usuario" class="btn btn-link p-0 text-decoration-none">Cadastre-se como Usuário Padrão</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const linkCad = document.getElementById('link_cad_usuario')
            if (linkCad) {
                linkCad.href = obterCaminho('/html/usuario/cadUsuario.html')
            }
        })
    </script>
    <script src="../js/usuario_js/login.js"></script>
</body>
</html>
