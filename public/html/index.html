<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Automação Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-robot text-primary display-4"></i>
                            <h2 class="fw-bold mt-2">Acesso ao Sistema</h2>
                            <p class="text-muted">Informe suas credenciais para continuar</p>
                        </div>

                        <form id="form_login">
                            <div class="mb-3">
                                <label for="email" class="form-label font-semibold">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label font-semibold">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
                                </div>
                            </div>

                            <button type="submit" id="btn_login" class="btn btn-primary w-100 py-2 fw-semibold">
                                Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>
                        </form>

                        <div id="resposta" class="mt-3"></div>

                        <div class="text-center mt-4 border-top pt-3">
                            <p class="text-muted mb-0">Não tem uma conta?</p>
                            <a href="/html/usuario/cadUsuario.html" class="btn btn-link text-decoration-none fw-semibold">Cadastre-se como Usuário Padrão</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/usuario_js/login.js"></script>
</body>
</html>
