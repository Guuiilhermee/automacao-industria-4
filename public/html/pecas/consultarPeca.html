<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Peça - Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-search text-primary display-4"></i>
                            <h2 class="fw-bold mt-2">Consultar Peça por Código</h2>
                            <p class="text-muted">Informe o código/ID para buscar detalhes da peça</p>
                        </div>

                        <form id="form_consultar" class="row g-2 mb-4">
                            <div class="col-8 col-sm-9">
                                <input type="number" class="form-control" id="id" placeholder="Digite o Código da Peça" required min="1">
                            </div>
                            <div class="col-4 col-sm-3">
                                <button type="submit" id="btn_consultar" class="btn btn-primary w-100 fw-semibold">
                                    <i class="bi bi-search me-1"></i> Buscar
                                </button>
                            </div>
                        </form>

                        <div id="resposta"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/peca_js/consult_peca.js"></script>
</body>
</html>
