<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Peças - Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container my-4">
        <div class="card border">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h2 class="h4 fw-bold mb-0">Listagem de Peças</h2>
                <button id="btn_listar" class="btn btn-outline-secondary btn-sm">
                    Atualizar Lista
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nome</th>
                                <th scope="col">Cor</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Quantidade</th>
                            </tr>
                        </thead>
                        <tbody id="resposta">
                            <tr>
                                <td colspan="5" class="text-center text-body-secondary py-4">Carregando listagem...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/peca_js/list_peca.js"></script>
</body>
</html>
