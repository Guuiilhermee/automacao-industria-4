<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Peça - Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-box-seam text-success display-4"></i>
                            <h2 class="fw-bold mt-2">Cadastrar Peça</h2>
                            <p class="text-muted">Selecione a cor da peça que deseja registrar</p>
                        </div>

                        <form id="form_cadastrar">
                            <div class="mb-3">
                                <label for="nome" class="form-label font-semibold">Nome da Peça</label>
                                <input type="text" class="form-control bg-light" id="nome" value="Bloco" readonly>
                            </div>

                            <div class="mb-3">
                                <label for="cor" class="form-label font-semibold">Cor da Peça</label>
                                <select class="form-select" id="cor" required>
                                    <option value="" selected disabled>Selecione a cor...</option>
                                    <option value="Vermelho">Vermelho</option>
                                    <option value="Verde">Verde</option>
                                    <option value="Azul">Azul</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="tipo" class="form-label font-semibold">Tipo da Peça</label>
                                <input type="text" class="form-control bg-light" id="tipo" value="Caixa" readonly>
                            </div>

                            <div class="mb-4">
                                <label for="quantidade" class="form-label font-semibold">Quantidade a Adicionar</label>
                                <input type="number" class="form-control" id="quantidade" placeholder="1" min="1" value="1" required>
                            </div>

                            <button type="submit" id="btn_cadastrar" class="btn btn-success w-100 py-2 fw-semibold">
                                <i class="bi bi-plus-circle me-1"></i> Cadastrar Peça
                            </button>
                        </form>

                        <div id="resposta" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/peca_js/register_peca.js"></script>
</body>
</html>
