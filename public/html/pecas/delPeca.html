<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover 1 Unidade - Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-dash-circle-fill text-danger display-4"></i>
                            <h2 class="fw-bold mt-2">Remover Unidade do Estoque</h2>
                            <p class="text-muted">Informe o código da peça</p>
                        </div>

                        <form id="form_excluir">
                            <div class="mb-4">
                                <label for="id" class="form-label font-semibold">Código da Peça (ID)</label>
                                <input type="number" class="form-control" id="id" placeholder="Digite o código da peça" required min="1">
                            </div>

                            <button type="submit" id="btn_apagar" class="btn btn-danger w-100 py-2 fw-semibold">
                                <i class="bi bi-dash-lg me-1"></i> Remover
                            </button>
                        </form>

                        <div id="resposta" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/peca_js/delete_peca.js"></script>
</body>
</html>
