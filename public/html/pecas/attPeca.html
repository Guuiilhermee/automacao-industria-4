<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Peça - Indústria 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border">
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <h2 class="fw-bold mb-1">Atualizar Peça</h2>
                            <p class="text-body-secondary mb-0">Informe o código da peça e selecione a cor ou quantidade</p>
                        </div>

                        <form id="form_atualizar">
                            <div class="mb-3">
                                <label for="codPeca" class="form-label">Código da Peça (ID)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="codPeca" placeholder="Digite o código" required min="1">
                                    <button class="btn btn-outline-secondary" type="button" id="btn_carregar_peca">
                                        Carregar Dados
                                    </button>
                                </div>
                            </div>

                            <hr class="my-3">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome da Peça</label>
                                <input type="text" class="form-control" id="nome" value="Bloco" readonly>
                            </div>

                            <div class="mb-3">
                                <label for="cor" class="form-label">Cor da Peça</label>
                                <select class="form-select" id="cor" required>
                                    <option value="" selected disabled>Selecione a cor...</option>
                                    <option value="Vermelho">Vermelho</option>
                                    <option value="Verde">Verde</option>
                                    <option value="Azul">Azul</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="tipo" class="form-label">Tipo da Peça</label>
                                <input type="text" class="form-control" id="tipo" value="Caixa" readonly>
                            </div>

                            <div class="mb-4">
                                <label for="quantidade" class="form-label">Quantidade em Estoque</label>
                                <input type="number" class="form-control" id="quantidade" placeholder="0" min="0" required>
                            </div>

                            <button type="submit" id="btn_atualizar" class="btn btn-primary w-100 py-2">
                                Salvar Alterações
                            </button>
                        </form>

                        <div id="resposta" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/peca_js/update_peca.js"></script>
</body>
</html>
